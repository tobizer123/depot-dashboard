const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function entschluesseln(pw){
  const km = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw),
    "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey(
    {name:"PBKDF2", salt:b64(P.salt), iterations:P.iter, hash:"SHA-256"},
    km, {name:"AES-GCM", length:256}, false, ["decrypt"]);
  const klar = await crypto.subtle.decrypt({name:"AES-GCM", iv:b64(P.iv)}, key, b64(P.daten));
  return new TextDecoder().decode(klar);
}
async function anzeigen(pw){
  const html = await entschluesseln(pw);
  localStorage.setItem("testdepot_passwort", pw);
  document.open(); document.write(html); document.close();
}
async function entsperren(){
  const pw = document.getElementById("pw").value.trim();   // Leerzeichen durch Autokorrektur ignorieren
  try { await anzeigen(pw); }
  catch(e){ document.getElementById("fehler").textContent = "Falsches Passwort"; }
}
document.getElementById("pw").addEventListener("keydown", e => {
  if(e.key === "Enter") entsperren(); });
const gespeichert = localStorage.getItem("testdepot_passwort");
if (gespeichert) anzeigen(gespeichert).catch(() => localStorage.removeItem("testdepot_passwort"));
